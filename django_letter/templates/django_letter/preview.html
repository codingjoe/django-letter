{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ email_name }}</title>
    <script type="module" src="{% static 'django_letter/preview.js' %}"></script>
    {# BasecoatUI 1.0.2, vendored from basecoat-css. #}
    <link rel="stylesheet" href="{% static 'django_letter/basecoat.min.css' %}">
    <style>
      :root {
        color-scheme: light;
        --frame: #ffffff;
      }

      html.dark {
        color-scheme: dark;
        --frame: #111827;
      }

      html,
      body {
        height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      .preview-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        padding: 12px 24px;
        gap: 12px;
      }

      .preview-bar .breadcrumb {
        margin-right: auto;
      }

      /* A Basecoat field fills its form; this one hugs its switch. */
      .preview-bar .field {
        flex: none;
        width: auto;
      }

      .modes {
        display: flex;
        padding: 2px;
        gap: 2px;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        background-color: var(--color-muted);
        font-size: var(--text-sm);
      }

      .modes > * {
        position: relative;
        padding: 4px 10px;
        border-radius: var(--radius-sm);
        color: inherit;
        text-decoration: none;
        white-space: nowrap;
        cursor: pointer;
      }

      .modes input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }

      .modes label:has(:checked) {
        background-color: var(--color-primary);
        color: var(--color-primary-foreground);
      }

      .modes label:has(:focus-visible) {
        outline: 2px solid var(--color-ring);
        outline-offset: 1px;
      }

      main {
        display: flex;
        flex: 1;
        min-height: 0;
        padding: 0 24px 24px;
        gap: 24px;
      }

      iframe {
        height: 100%;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        background-color: var(--frame);
        color-scheme: light;
      }

      /* The frame is filtered whole, so its chrome starts light and inverts to dark. */
      html[data-theme='invert'] iframe {
        border-color: #e5e7eb;
        background-color: #ffffff;
        filter: invert(1) hue-rotate(180deg);
      }

      .desktop {
        flex: 1;
        width: 100%;
      }

      /* The phone and its plain-text twin share one column. */
      .side {
        display: flex;
        flex: none;
        flex-direction: column;
        width: 375px;
        min-height: 0;
        gap: 24px;
      }

      .mobile {
        flex: none;
        aspect-ratio: 375 / 812;
        width: 100%;
        /* A phone screen, never taller than the room the text frame needs. */
        height: auto;
        max-height: 60%;
      }

      .text {
        flex: 1;
        width: 100%;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <header class="preview-bar">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <ol>
          <li><a href="{{ list_url }}">All emails</a></li>
          <li aria-hidden="true">
            <svg
              data-rtl-flip
              class="lucide lucide-chevron-right"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m9 18 6-6-6-6" />
            </svg>
          </li>
          <li><span aria-current="page">{{ email_name }}</span></li>
        </ol>
      </nav>
      <div class="modes" role="radiogroup" aria-label="Preview theme">
        <label title="The message as it is sent.">
          <input type="radio" name="theme" value="light">
          Light
        </label>
        <label title="Gmail, Yahoo! Mail and older Outlook invert the message. Images are not inverted.">
          <input type="radio" name="theme" value="invert">
          Dark (Gmail)
        </label>
        <label title="Apple Mail and newer Outlook apply the dark styles of the message.">
          <input type="radio" name="theme" value="author">
          Dark (Apple)
        </label>
      </div>
      <div role="group" class="field" data-orientation="horizontal">
        <input
          type="checkbox"
          id="block-tracking"
          role="switch"
          class="input"
          {% if not load_images %}checked{% endif %}
        >
        <label
          for="block-tracking"
          title="Stop every download and show only the pictures the message carries, the way clients stop tracking pixels. Turn it off to load every picture."
        >Block tracking</label>
      </div>
    </header>
    <main>
      {# `allow-same-origin` lets the themes read the message, nothing more. #}
      <iframe
        class="desktop"
        src="{% querystring raw=1 %}"
        title="Desktop preview"
        sandbox="allow-same-origin"
      ></iframe>
      <div class="side">
        <iframe
          class="mobile"
          src="{% querystring raw=1 %}"
          title="Mobile preview"
          sandbox="allow-same-origin"
        ></iframe>
        <iframe
          class="text"
          src="{% querystring plain=1 %}"
          title="Plain-text preview"
          sandbox="allow-same-origin"
        ></iframe>
      </div>
    </main>
  </body>
</html>
